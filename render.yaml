services:
  - type: web
    name: busiada-boarding
    env: python
    plan: free
    branch: busiada_boarding
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn config.wsgi --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_SECRET_KEY
        generator: "secret"
      - key: DJANGO_SERVE_MEDIA
        value: "False"
    # deployCommand temporarily removed to isolate build issues.
    # Re-enable after confirming the build succeeds.
    # deployCommand: "python manage.py migrate && python manage.py collectstatic --noinput && python create_admin.py"

databases:
  - name: busiada-boarding-db
    databaseName: busiada_boarding
    plan: free
