{% extends 'boarding/base.html' %}

{% block content_wrapper_start %}{% endblock %}
{% block content_wrapper_end %}{% endblock %}

{% block content %}
<section class="landing-hero bg-[#F8F7F4] min-h-screen overflow-hidden text-[#1A1A1A]">
    <style>
        .landing-hero {
            position: relative;
            min-height: calc(100vh - 5rem);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background-color: #F8F7F4;
            background-image: linear-gradient(180deg, rgba(26, 26, 26, 0.36), rgba(26, 26, 26, 0.26)), url('https://images.unsplash.com/photo-1571260899304-425eee4c7efc?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .landing-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 10, 0.34);
        }
        .landing-hero-shell {
            position: relative;
            z-index: 1;
            width: min(100%, 86rem);
            margin: 0 auto;
            padding: 4rem 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .landing-hero-copy h1 {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
            font-size: clamp(3.5rem, 10vw, 7.5rem);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.05em;
            color: #F8F7F4;
            text-shadow: 0 24px 80px rgba(0, 0, 0, 0.22);
        }
        @media (max-width: 768px) {
            .landing-hero-shell {
                padding: 3rem 1.25rem;
            }
            .landing-hero-copy h1 {
                font-size: clamp(2.5rem, 13vw, 5rem);
            }
        }
        @media (max-width: 480px) {
            .landing-hero-shell {
                padding: 2rem 0.75rem;
            }
            .landing-hero-copy h1 {
                font-size: clamp(2rem, 16vw, 4rem);
            }
        }
    </style>
    <div class="landing-hero-shell">
        <div class="landing-hero-copy">
            <h1>Busiada Girls Senior School</h1>
        </div>
    </div>
</section>
{% endblock %}
