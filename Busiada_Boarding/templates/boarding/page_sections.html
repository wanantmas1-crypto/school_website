{% if page.sections %}
    {% for section in page.sections %}
        {% if section.type == 'text' %}
            <section class="prose prose-slate max-w-none text-slate-700">
                {{ section.content|safe }}
            </section>
        {% else %}
            <section class="prose prose-slate max-w-none text-slate-700">
                {{ section|default:'' }}
            </section>
        {% endif %}
    {% endfor %}
{% else %}
    <div class="prose prose-slate max-w-none text-slate-700">{{ page.content|safe }}</div>
{% endif %}
