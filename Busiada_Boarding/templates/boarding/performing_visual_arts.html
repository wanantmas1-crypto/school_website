{% extends 'boarding/base.html' %}

{% block content %}
<section class="relative overflow-hidden bg-slate-50 py-20">
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <div class="rounded-[2rem] border border-slate-200 bg-white p-8 shadow-[0_24px_80px_-40px_rgba(15,23,42,0.3)] sm:p-10 lg:p-14">
      <p class="text-sm font-black uppercase tracking-[0.25em] text-cyan-600">Student Life</p>
      <h1 class="mt-4 text-3xl font-black text-slate-900 sm:text-4xl">Performing & Visual Arts</h1>
      <p class="mt-5 max-w-3xl text-lg leading-8 text-slate-600">
        Our arts programmes encourage creativity, confidence, cultural appreciation and pride in self-expression.
      </p>
      <div class="mt-10 grid gap-6 md:grid-cols-2">
        <article class="rounded-2xl border border-slate-200 bg-slate-50 p-6">Music, dance and drama</article>
        <article class="rounded-2xl border border-slate-200 bg-slate-50 p-6">Fine arts, design and exhibitions</article>
      </div>
    </div>
  </div>
</section>
{% endblock %}
