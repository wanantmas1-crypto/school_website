{% extends 'boarding/site_page.html' %}

{% block page_title %}{{ page.title|default:'Admissions' }}{% endblock %}
{% block page_subtitle %}{% if page.category %}{{ page.category }}{% else %}Admissions{% endif %}{% endblock %}

{% block page_content %}
    {{ block.super }}

    <section class="dynamic-panel reveal-on-scroll bg-white border border-slate-200 shadow-sm p-3 p-md-4 mt-4" style="border-radius:.5rem;">
        <h2 class="text-2xl font-semibold mb-4 text-[#0A2540]">Send Enquiry</h2>
        <form hx-post="{% url 'submit_inquiry' %}" hx-target="#response" class="space-y-6">
            <input type="text" name="name" placeholder="Full Name" required class="w-full p-4 border rounded-2xl">
            <input type="email" name="email" placeholder="Email" required class="w-full p-4 border rounded-2xl">
            <input type="tel" name="phone" placeholder="Phone" class="w-full p-4 border rounded-2xl">
            <textarea name="message" placeholder="Message" rows="5" class="w-full p-4 border rounded-2xl"></textarea>
            <button type="submit" class="bg-[#0A2540] text-white px-8 py-4 rounded-2xl">Submit</button>
        </form>
        <div id="response" class="mt-6"></div>
    </section>
{% endblock %}
